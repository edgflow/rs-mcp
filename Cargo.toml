[package]
name = "rs-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A small MCP server in Rust: notes in PostgreSQL, exposed to AI clients as MCP tools over stdio"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
dotenvy = "0.15.7"
rmcp = { version = "3.7.0", features = ["server", "macros", "transport-io"] }
schemars = { version = "1.2.3", features = ["chrono04", "uuid1"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["serde"] }

[dev-dependencies]
# The SDK's client side, to test the server through the MCP protocol.
rmcp = { version = "3.7.0", features = ["client"] }
