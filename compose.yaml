# Local PostgreSQL for development and tests: docker compose up -d
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: notes
      POSTGRES_DB: notes
    ports:
      # Bound to localhost only: not reachable from other machines.
      - "127.0.0.1:5432:5432"
    volumes:
      - notes-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes -d notes"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  notes-data:
